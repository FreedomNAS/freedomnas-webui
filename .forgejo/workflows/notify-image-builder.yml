# Switched off: notify-image-builder runs on GitHub.
name: notify-image-builder

# On every push to main, ask freedomnas-image-builder to rebuild its
# images (ADR-002 / IMAGE-BASED-INSTALLATION.md: images are rebuilt
# whenever core/profiles/webui change). This is a single unprivileged
# API call, so it runs fine on Codeberg's normal hosted runner --
# unlike freedomnas-image-builder's own build job, which needs a
# self-hosted runner. See freedomnas-image-builder/docs/ci-setup.md for
# how to generate/rotate IMAGE_BUILDER_TRIGGER_TOKEN (must be set as a
# secret on this repo before this workflow can succeed).
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: docker
    steps:
      - name: Trigger freedomnas-image-builder workflow_dispatch
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token ${IMAGE_BUILDER_TRIGGER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://codeberg.org/api/v1/repos/FreedomNAS/freedomnas-image-builder/actions/workflows/build-images.yml/dispatches"
        env:
          IMAGE_BUILDER_TRIGGER_TOKEN: ${{ secrets.IMAGE_BUILDER_TRIGGER_TOKEN }}
