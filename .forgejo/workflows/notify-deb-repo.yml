name: notify-deb-repo

# On every push to dev or main, ask freedomnas-deb to rebuild and publish
# the Debian packages. A push to dev becomes a snapshot in the `dev`
# component; a push to main becomes a release, at the version
# debian/changelog names, in `main`.
#
# One unprivileged API call, so Codeberg's hosted runner is enough. See
# freedomnas-deb/docs/ci-setup.md for how to generate and rotate
# DEB_REPO_TRIGGER_TOKEN, which has to be set as a secret on this repo
# before this workflow can succeed.
on:
  push:
    branches: [main, dev]

jobs:
  notify:
    runs-on: docker
    steps:
      - name: Trigger freedomnas-deb workflow_dispatch
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token ${DEB_REPO_TRIGGER_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"dev\",\"inputs\":{\"ref\":\"${GITHUB_REF_NAME}\"}}" \
            "https://codeberg.org/api/v1/repos/FreedomNAS/freedomnas-deb/actions/workflows/publish-packages.yml/dispatches"
        env:
          DEB_REPO_TRIGGER_TOKEN: ${{ secrets.DEB_REPO_TRIGGER_TOKEN }}
