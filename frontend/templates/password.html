<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Your Password — FreedomNAS</title>
  <link rel="icon" type="image/png" href="/static/img/logo_cut.png">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="/static/img/logo_cut.png" alt="FreedomNAS logo" width="72" height="72">
      <img src="/static/img/logo.png" alt="FreedomNAS" style="height:28px;width:auto;margin-top:4px">
      <p>Change your password</p>
    </div>

    <form id="password-form" class="auth-form" autocomplete="on" novalidate>
      <p class="text-muted text-sm" style="margin:0 0 12px">
        For every account of this NAS: the new password is used for its files (SMB) and for signing in.
        A temporary password you were given goes in the first field.
      </p>
      <div class="form-group">
        <label class="form-label" for="field-user">Username</label>
        <input id="field-user" class="input" type="text" autocomplete="username" required spellcheck="false">
      </div>
      <div class="form-group">
        <label class="form-label" for="field-current">Current password</label>
        <input id="field-current" class="input" type="password" autocomplete="current-password" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="field-new">New password</label>
        <input id="field-new" class="input" type="password" autocomplete="new-password" required>
        <span class="form-hint">At least 8 characters.</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="field-new2">New password again</label>
        <input id="field-new2" class="input" type="password" autocomplete="new-password" required>
      </div>

      <div id="password-error" class="alert alert-err" role="alert" hidden></div>
      <div id="password-done" class="alert alert-ok" role="status" hidden></div>

      <button id="btn-change" type="submit" class="btn btn-primary w-full" style="margin-top:4px">
        Change Password
      </button>
    </form>

    <div class="auth-footer">
      <a href="/auth/">Back to sign in</a>
    </div>
  </div>
</div>

<script src="/static/js/password.js"></script>
</body>
</html>
