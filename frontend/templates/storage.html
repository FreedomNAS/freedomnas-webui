{% extends "base.html" %}
{% block title %}Storage{% endblock %}
{% block page_title %}Storage{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-text">
    <h1>Storage</h1>
    <p>ZFS pools, datasets, and snapshots</p>
  </div>
  <div class="page-header-actions">
    <button id="btn-create-snap" class="btn btn-secondary advanced-only" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Create Snapshot
    </button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="pools">Pools</button>
  <button class="tab-btn" data-tab="datasets">Datasets</button>
  <button class="tab-btn advanced-only" data-tab="snapshots">Snapshots</button>
</div>

<div id="panel-pools"     class="tab-panel active"></div>
<div id="panel-datasets"  class="tab-panel"></div>
<div id="panel-snapshots" class="tab-panel"></div>

<!-- Dataset properties: reachable only above assisted level -->
<div id="modal-properties" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal modal-wide">
    <div class="modal-header">
      <span class="modal-title">Properties — <span id="prop-dataset" class="mono"></span></span>
      <button class="modal-close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="form-properties">
      <div class="modal-body" id="prop-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" id="btn-prop-submit" class="btn btn-primary">Apply Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- Create snapshot modal -->
<div id="modal-snapshot" class="modal-backdrop" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Create Snapshot</span>
      <button class="modal-close" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="form-snapshot">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="f-snap-dataset">Dataset / Pool</label>
          <input id="f-snap-dataset" class="input" type="text" list="ds-list"
                 placeholder="datapool" required autocomplete="off">
          <datalist id="ds-list"></datalist>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-snap-name">Snapshot Name</label>
          <input id="f-snap-name" class="input" type="text"
                 placeholder="manual-2026-06-27" required autocomplete="off">
          <span class="form-hint">Will be created as dataset@name</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close>Cancel</button>
        <button type="submit" id="btn-snap-submit" class="btn btn-primary">Create Snapshot</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/storage.js"></script>
{% endblock %}
