<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FreedomNAS{% endblock %} — FreedomNAS</title>
  <link rel="icon" type="image/png" href="/static/img/logo_cut.png">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body data-ui="assisted">

<!-- SVG sprite (icons) -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="icon-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
    <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
  </symbol>
  <symbol id="icon-storage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
  </symbol>
  <symbol id="icon-shares" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
  </symbol>
  <symbol id="icon-network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="7" width="20" height="15" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
    <line x1="12" y1="12" x2="12" y2="16"/><line x1="9.17" y1="12" x2="12" y2="12"/>
  </symbol>
  <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
  </symbol>
  <symbol id="icon-updates" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
  </symbol>
  <symbol id="icon-services" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="7" rx="1"/><rect x="2" y="14" width="20" height="7" rx="1"/>
    <line x1="6" y1="6.5" x2="6.01" y2="6.5"/><line x1="6" y1="17.5" x2="6.01" y2="17.5"/>
  </symbol>
  <symbol id="icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.07 4.93l-1.41 1.41M5.34 17.66l-1.41 1.41M21 12h-2M5 12H3M19.07 19.07l-1.41-1.41M5.34 6.34L3.93 4.93M12 21v-2M12 5V3"/>
  </symbol>
  <symbol id="icon-module" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
  </symbol>
  <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
  </symbol>
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
  </symbol>
  <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </symbol>
  <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
    <polyline points="16 17 21 12 16 7"/>
    <line x1="21" y1="12" x2="9" y2="12"/>
  </symbol>
  <symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
  </symbol>
  <symbol id="icon-help" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/>
    <line x1="12" y1="17" x2="12.01" y2="17"/>
  </symbol>
</svg>

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-logo">
      <img src="/static/img/logo_cut.png" alt="FreedomNAS">
      <div class="sidebar-logo-text">
        <span class="sidebar-logo-name">FreedomNAS</span>
        <span class="sidebar-logo-edition" id="sidebar-edition">loading…</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a href="/dashboard/" class="nav-item" role="menuitem">
        <svg><use href="#icon-dashboard"/></svg>
        <span class="nav-item-label">Dashboard</span>
      </a>
      <a href="/storage/" class="nav-item" role="menuitem">
        <svg><use href="#icon-storage"/></svg>
        <span class="nav-item-label">Storage</span>
      </a>
      <a href="/shares/" class="nav-item" role="menuitem">
        <svg><use href="#icon-shares"/></svg>
        <span class="nav-item-label">Shares</span>
      </a>
      <a href="/network/" class="nav-item" role="menuitem">
        <svg><use href="#icon-network"/></svg>
        <span class="nav-item-label">Network</span>
      </a>
      <a href="/users/" class="nav-item" role="menuitem">
        <svg><use href="#icon-users"/></svg>
        <span class="nav-item-label">Users</span>
      </a>
      <a href="/updates/" class="nav-item" role="menuitem">
        <svg><use href="#icon-updates"/></svg>
        <span class="nav-item-label">Updates</span>
      </a>
      <a href="/services/" class="nav-item advanced-only" role="menuitem">
        <svg><use href="#icon-services"/></svg>
        <span class="nav-item-label">Services</span>
      </a>
      {% for item in community_nav %}
      <a href="{{ item.href }}" class="nav-item {{ item.level_class }}" role="menuitem">
        <svg><use href="{{ item.icon }}"/></svg>
        <span class="nav-item-label">{{ item.label }}</span>
      </a>
      {% endfor %}
      <a href="/system/" class="nav-item" role="menuitem">
        <svg><use href="#icon-system"/></svg>
        <span class="nav-item-label">System</span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a href="/docs/" class="nav-item" target="_blank" rel="noopener" id="nav-docs">
        <svg><use href="#icon-book"/></svg>
        <span class="nav-item-label">Documentation</span>
      </a>
      <button class="nav-item w-full" id="btn-logout" title="Sign out">
        <svg><use href="#icon-logout"/></svg>
        <span class="nav-item-label">Sign Out</span>
      </button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

  <!-- Main area -->
  <div class="main-area" id="main-area">
    <!-- Topbar -->
    <header class="topbar" role="banner">
      <button class="topbar-toggle" id="btn-sidebar-toggle" aria-label="Toggle sidebar">
        <svg><use href="#icon-menu"/></svg>
      </button>

      <div class="topbar-breadcrumb">
        <span class="page-title">{% block page_title %}{% endblock %}</span>
      </div>

      <div class="topbar-actions">
        <!-- UI Level selector -->
        <select id="ui-level-select" class="select" style="width:auto;padding:5px 28px 5px 10px;font-size:0.78rem" title="Interface complexity level" aria-label="UI Level">
          <option value="assisted">Assisted</option>
          <option value="advanced">Advanced</option>
          <option value="expert">Expert</option>
        </select>

        <a class="topbar-btn" id="btn-help" href="/docs/" target="_blank" rel="noopener" aria-label="Help for this page" title="Help for this page">
          <svg><use href="#icon-help"/></svg>
        </a>

        <button class="topbar-btn" id="btn-theme" aria-label="Toggle theme" title="Toggle theme">
          <!-- filled by JS -->
        </button>

        <div class="topbar-user">
          <div class="topbar-user-avatar" id="topbar-avatar">A</div>
          <span class="topbar-username" id="topbar-username">admin</span>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <div class="page-content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<div id="toast-stack"></div>

<!-- Global confirm modal -->
<div id="global-confirm" class="modal-backdrop" role="dialog" aria-modal="true" hidden></div>

<script src="/static/js/main.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
