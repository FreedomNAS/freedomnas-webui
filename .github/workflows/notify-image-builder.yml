name: notify-image-builder

# On every push to main, asks FreedomNAS/freedomnas-image to build and
# publish the images of the release (its build-images workflow, through a
# repository_dispatch). The token is the organization secret
# PACKAGES_DISPATCH_TOKEN, which must reach freedomnas-image too.

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - name: Ask freedomnas-image to build the images
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "the PACKAGES_DISPATCH_TOKEN secret is not set" >&2; exit 1; }
          gh api repos/FreedomNAS/freedomnas-image/dispatches \
            -f event_type=build-images -f "client_payload[channel]=main"
